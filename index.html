<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Voting</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body { font-family: Arial; padding: 20px; text-align: center; }
button { padding: 10px; margin: 5px; cursor: pointer; }
</style>
</head>
<body>

<h1>Голосование</h1>

<button onclick="showAdmin()">Админ</button>
<button onclick="showVoter()">Голосовать</button>

<div id="app"></div>

<script>
// ================== 🔑 ВСТАВЬ СЮДА СВОЙ CONFIG ==================
const firebaseConfig = {
  apiKey: "PASTE_HERE",
  authDomain: "PASTE_HERE",
  projectId: "PASTE_HERE",
};
// ===============================================================

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ===== ДАННЫЕ =====
const pollId = "mainPoll";

let unsubscribe = null;

// ===== ADMIN =====
function showAdmin() {
  document.getElementById('app').innerHTML = `
    <h2>Админ панель</h2>
    <button onclick="startPoll()">▶ Запустить</button>
    <button onclick="stopPoll()">⏹ Остановить</button>
    <div id="results"></div>
  `;

  subscribe();
}

async function startPoll() {
  await db.collection("polls").doc(pollId).set({
    votes: [0, 0],
    isOpen: true
  });
}

async function stopPoll() {
  await db.collection("polls").doc(pollId).update({
    isOpen: false
  });
}

// ===== VOTER =====
function showVoter() {
  document.getElementById('app').innerHTML = `
    <h2>Голосуй</h2>
    <button onclick="vote(0)">A</button>
    <button onclick="vote(1)">B</button>
  `;
}

async function vote(i) {
  const ref = db.collection("polls").doc(pollId);

  await ref.update({
    [`votes.${i}`]: firebase.firestore.FieldValue.increment(1)
  });

  alert("Голос принят");
}

// ===== REALTIME =====
function subscribe() {
  if (unsubscribe) unsubscribe();

  unsubscribe = db.collection("polls").doc(pollId)
    .onSnapshot(doc => {
      if (!doc.exists) return;

      const data = doc.data();
      renderResults(data);
    });
}

function renderResults(data) {
  const total = data.votes.reduce((a,b)=>a+b,0);

  document.getElementById('results').innerHTML = `
    <p>A: ${data.votes[0]}</p>
    <p>B: ${data.votes[1]}</p>
    <p>Всего: ${total}</p>
  `;
}
</script>

</body>
</html>
